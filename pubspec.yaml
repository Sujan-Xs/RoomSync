name: roomsync
description: "RoomSync - Mobile swipe and match flatmate finder app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Swiper Components
  flutter_card_swiper: ^7.0.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Supabase Cloud Client & Realtime
  supabase_flutter: ^2.5.6

  # Local Persistence & Database Caching
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
